name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlockchainHistory.slnx

      - name: Build (warnings are errors)
        run: dotnet build BlockchainHistory.slnx -c Release --no-restore

      - name: Unit, integration and functional tests
        run: dotnet test --solution BlockchainHistory.slnx -c Release --no-build

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build container images
        run: docker compose build
